name: Exploration temporaire (sources météo)
on:
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          UA={"User-Agent":"STATION-SDR (F4JCF) exploration"}
          def get(u, n=None):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40)
                  b=r.read(); return r.status, b
              except Exception as e:
                  return str(e), b""
          def ls(u):
              s,b=get(u); h=b.decode("utf-8","replace")
              return [urllib.parse.unquote(x) for x in re.findall(r'href="([^"?]+)"',h) if not x.startswith("..")]
          base="https://opendata.dwd.de/weather/charts/forecasts/icon/"
          for d in ls(base):
              print("DIR", d)
              if d.endswith("/"):
                  for f in ls(base+d)[:200]:
                      print("   ", d+f)
                      if f.endswith("/"):
                          for g in ls(base+d+f)[:60]:
                              print("       ", d+f+g)
          print("=== analysis nwv01")
          for f in ls("https://opendata.dwd.de/weather/charts/analysis/"):
              if "nwv01" in f and "LATEST" not in f: print("   ", f)
          for u in ["https://vigilance2019.meteofrance.com/data/NXFR33_LFPW_.xml",
                    "https://vigilance.meteofrance.fr/data/NXFR33_LFPW_.xml",
                    "https://www.vigilance.meteofrance.fr/fr/alpes-maritimes",
                    "https://meteofrance.com/meteo-vigilance",
                    "https://feeds.meteoalarm.org/api/v1/warnings/feeds-france",
                    "https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-france",
                    "https://services.swpc.noaa.gov/json/f107_cm_flux.json",
                    "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json",
                    "https://services.swpc.noaa.gov/products/noaa-scales.json",
                    "https://www.hamqsl.com/solarxml.php"]:
              s,b=get(u); print("URL",u,s,len(b)); print(b[:1500].decode("utf-8","replace").replace("\n"," ")[:1500])
          PY
