name: Cartes DWD du matin (analyses, prévisions, vigilance, propagation)

# Chaque nuit, récupère les analyses en surface Atlantique Nord – Europe du DWD
# (les mêmes que le fax de Hambourg) des 30 dernières heures et les range dans
# la branche « cartes-dwd » (sans historique, écrasée à chaque fois). Elles
# servent à l'analyse météo envoyée chaque matin. Aucun effet sur l'application,
# la branche main ni les Releases.

on:
  schedule:
    - cron: "47 3 * * *"        # 03:47 UTC (04:47 l'hiver, 05:47 l'été à Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cartes:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger les analyses DWD
        run: |
          python3 - <<'PY'
          import re, json, urllib.request, urllib.parse, datetime, os
          BASE = "https://opendata.dwd.de/weather/charts/analysis/"
          UA = {"User-Agent": "STATION-SDR (F4JCF) cartes-dwd"}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
          html = get(BASE).decode("utf-8", "replace")
          names = sorted({urllib.parse.unquote(h).rsplit("/", 1)[-1] for h in re.findall(r'href="([^"]+)"', html)})
          # analyse de 00, 06, 12, 18 UTC : WV12SW = noir et blanc (comme le fax), WV12 = couleur
          charts = {}
          for n in names:
              m = re.search(r"^Z__C_EDZW_\d{14}_tka01,ana_bwkman_dwdna_O_000000_000000_(\d{12})_WV12(SW)?\.png$", n)
              if m:
                  charts.setdefault(m.group(1), {})["nb" if m.group(2) else "couleur"] = n
          limit = (datetime.datetime.utcnow() - datetime.timedelta(hours=30)).strftime("%Y%m%d%H%M")
          keep = sorted(k for k in charts if k >= limit) or sorted(charts)[-1:]
          os.makedirs("cartes", exist_ok=True)
          index = []
          for k in keep:
              item = {"analyse_utc": f"{k[:4]}-{k[4:6]}-{k[6:8]} {k[8:10]}:{k[10:12]}"}
              for kind in ("nb", "couleur"):
                  if kind == "couleur" and k != keep[-1]:
                      continue                     # couleur : seulement la dernière
                  if kind in charts[k]:
                      f = f"DWD_{k[:8]}-{k[8:12]}_{kind}.png"
                      open(f"cartes/{f}", "wb").write(get(BASE + urllib.parse.quote(charts[k][kind])))
                      item[kind] = f
              index.append(item)
          # Prévisions : pression en surface Atlantique Nord (même style que l'analyse, run de 00 UTC)
          # et pluie sur 24 h Europe (dernier run disponible).
          prev = []
          FC = "https://opendata.dwd.de/weather/charts/forecasts/icon/global/"
          def listing(url):
              h = get(url).decode("utf-8", "replace")
              return sorted({urllib.parse.unquote(x).rsplit("/", 1)[-1] for x in re.findall(r'href="([^"]+)"', h)})
          def run_dt(run):
              return datetime.datetime.strptime(run, "%Y%m%d%H%M")
          for sub, pat, kind in (("na/", r"ico_tkb_na_N_0000(\d\d)_000000_(\d{12})_WV12\.png$", "pression"),
                                 ("eu/", r"ico_r24_eu_N_0000(\d\d)_999999_(\d{12})_WV1\.png$", "pluie24h")):
              try:
                  found = {}
                  for n in listing(FC + sub):
                      m = re.search(r"^Z__C_EDZW_\d{14}_nwv01," + pat, n)
                      if m:
                          found.setdefault(m.group(2), {})[int(m.group(1))] = n
                  if not found:
                      continue
                  run = max(found)
                  for h in sorted(found[run]):
                      valid = run_dt(run) + datetime.timedelta(hours=h)
                      f = f"PREV_{kind}_{valid:%Y%m%d-%H%M}.png"
                      open(f"cartes/{f}", "wb").write(get(FC + sub + urllib.parse.quote(found[run][h])))
                      prev.append({"type": kind, "run_utc": f"{run_dt(run):%Y-%m-%d %H:%M}", "echeance_h": h,
                                   "valable_utc": f"{valid:%Y-%m-%d %H:%M}", "fichier": f})
              except Exception as exc:
                  print("Prévisions", sub, "indisponibles :", exc)

          # Vigilance Météo-France (rediffusée par MeteoAlarm, sans clé) pour les Alpes-Maritimes
          vigi = {"source": "MeteoAlarm (Météo-France)", "departement": "Alpes-Maritimes", "alertes": []}
          try:
              data = json.loads(get("https://feeds.meteoalarm.org/api/v1/warnings/feeds-france"))
              now = datetime.datetime.now(datetime.timezone.utc)
              seen = set()
              for w in data.get("warnings", []):
                  for info in w.get("alert", {}).get("info", []):
                      if not info.get("language", "").startswith("fr"):
                          continue
                      areas = info.get("area", [])
                      if not any(a.get("areaDesc") == "Alpes-Maritimes" or
                                 any(g.get("value") == "FRL03" for g in a.get("geocode", [])) for a in areas):
                          continue
                      try:
                          if datetime.datetime.fromisoformat(info["expires"]) < now:
                              continue
                      except Exception:
                          pass
                      lvl = next((p["value"] for p in info.get("parameter", []) if p.get("valueName") == "awareness_level"), "")
                      key = (info.get("event"), info.get("onset"), info.get("expires"))
                      if key in seen:
                          continue
                      seen.add(key)
                      vigi["alertes"].append({"evenement": info.get("event"), "niveau": lvl,
                                              "debut": info.get("onset"), "fin": info.get("expires"),
                                              "description": info.get("description")})
              vigi["statut"] = "ok"
          except Exception as exc:
              vigi["statut"] = f"indisponible : {exc}"

          # Propagation : NOAA SWPC (flux solaire, Kp, échelles R/S/G) et HamQSL (état des bandes)
          prop = {}
          for key, url in (("flux_10cm", "https://services.swpc.noaa.gov/json/f107_cm_flux.json"),
                           ("kp_3h", "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),
                           ("echelles_noaa", "https://services.swpc.noaa.gov/products/noaa-scales.json")):
              try:
                  d = json.loads(get(url))
                  prop[key] = d[-3:] if key == "flux_10cm" else d[-9:] if key == "kp_3h" else d
              except Exception as exc:
                  prop[key] = f"indisponible : {exc}"
          try:
              import xml.etree.ElementTree as ET
              root = ET.fromstring(get("https://www.hamqsl.com/solarxml.php"))
              sd = root.find("solardata")
              prop["hamqsl"] = {c.tag: (c.text or "").strip() for c in sd if c.tag not in ("calculatedconditions", "calculatedvhfconditions")}
              prop["hamqsl"]["bandes_hf"] = [{"bandes": b.get("name"), "moment": b.get("time"), "etat": (b.text or "").strip()}
                                             for b in sd.find("calculatedconditions")]
              prop["hamqsl"]["vhf"] = [{"phenomene": b.get("name"), "zone": b.get("location"), "etat": (b.text or "").strip()}
                                       for b in sd.find("calculatedvhfconditions")]
          except Exception as exc:
              prop["hamqsl"] = f"indisponible : {exc}"

          json.dump({"recupere_utc": datetime.datetime.utcnow().isoformat(timespec="minutes"),
                     "derniere": keep[-1] if keep else None, "cartes": index, "previsions": prev,
                     "vigilance": vigi, "propagation": prop},
                    open("cartes/index.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps({"cartes": index, "previsions": prev, "vigilance": vigi}, ensure_ascii=False, indent=1))
          if not index:
              raise SystemExit("Aucune analyse trouvée")
          PY
      - name: Ranger les cartes dans la branche cartes-dwd
        run: |
          cd cartes
          git init -q -b cartes-dwd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Cartes DWD\n\nAnalyses en surface Atlantique Nord – Europe du DWD (opendata.dwd.de),\nremplacées chaque nuit par le workflow « Cartes DWD du matin ». Branche sans historique.\n' > README.md
          git add -A
          git commit -qm "Cartes DWD $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cartes-dwd
