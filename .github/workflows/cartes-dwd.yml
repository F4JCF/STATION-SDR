name: Cartes DWD du matin

# Chaque nuit, récupère les analyses en surface Atlantique Nord – Europe du DWD
# (les mêmes que le fax de Hambourg) publiées ces dernières 26 heures, et les
# garde 3 jours comme « artifact » de ce workflow. Elles servent à l'analyse
# météo envoyée chaque matin. N'a aucun effet sur l'application ni sur les Releases.

on:
  schedule:
    - cron: "47 3 * * *"        # 03:47 UTC (04:47 l'hiver, 05:47 l'été à Paris)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cartes:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger les analyses DWD
        run: |
          python3 - <<'PY'
          import re, json, time, urllib.request, urllib.parse, datetime, os
          BASE = "https://opendata.dwd.de/weather/charts/analysis/"
          UA = {"User-Agent": "STATION-SDR (F4JCF) cartes-dwd"}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
          html = get(BASE).decode("utf-8", "replace")
          names = sorted({urllib.parse.unquote(h).rsplit("/", 1)[-1] for h in re.findall(r'href="([^"]+)"', html)})
          dwdna = [n for n in names if "ana_bwkman_dwdna" in n]
          print("Fichiers dwdna sur le serveur :")
          for n in dwdna:
              print("  ", n)
          limit = (datetime.datetime.utcnow() - datetime.timedelta(hours=26)).strftime("%Y%m%d%H%M%S")
          os.makedirs("cartes", exist_ok=True)
          got = []
          for n in dwdna:
              m = re.search(r"EDZW_(\d{14})_", n)
              if not m or not n.lower().endswith(".png") or m.group(1) < limit:
                  continue
              out = f"cartes/DWD_{m.group(1)[:8]}-{m.group(1)[8:12]}.png"
              if os.path.exists(out):
                  out = out[:-4] + f"_{len(got)}.png"
              open(out, "wb").write(get(BASE + urllib.parse.quote(n)))
              got.append({"fichier": os.path.basename(out), "source": n})
          if not got:
              n = "Z__C_EDZW_LATEST_tka01,ana_bwkman_dwdna_O_000000_000000_LATEST_WV12.png"
              open("cartes/DWD_LATEST.png", "wb").write(get(BASE + urllib.parse.quote(n)))
              got.append({"fichier": "DWD_LATEST.png", "source": n})
          json.dump({"recupere_utc": datetime.datetime.utcnow().isoformat(timespec="minutes"), "cartes": got},
                    open("cartes/index.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps(got, ensure_ascii=False, indent=1))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cartes-dwd
          path: cartes/
          retention-days: 3
