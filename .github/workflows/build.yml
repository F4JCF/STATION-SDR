name: Build and release Windows executable

# Compile STATION-SDR pour Windows (.exe) et Linux (PC x86_64 et ARM 64 bits,
# ex. Raspberry Pi), puis publie les trois fichiers dans la même Release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à compiler et publier (ex: v1.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Pas d'« artifacts » GitHub Actions (leur quota de stockage saturait et
# bloquait la publication) : la Release est créée en brouillon, chaque
# compilation y dépose directement son fichier, puis elle est publiée.
# Tant qu'elle est en brouillon, la mise à jour automatique ne la voit pas.

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: |
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG déjà présente"
          else
            gh release create "$TAG" -R "${{ github.repository }}" --draft --generate-notes --verify-tag
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name STATION-SDR `
            --icon station_sdr/assets/icon.ico `
            --add-data "station_sdr/assets/logo.png;assets" `
            --add-data "station_sdr/assets/icon.ico;assets" `
            --add-data "station_sdr/assets/flags.json;assets" `
            --hidden-import pystray._win32 `
            --collect-all tkintermapview --collect-all PIL run.py

      - name: Upload to release
        shell: bash
        run: gh release upload "$TAG" dist/STATION-SDR.exe --clobber -R "${{ github.repository }}"

      # Installateur (icône sur le Bureau + menu Démarrer), comme CAT Pilot.
      # Envoyé APRÈS STATION-SDR.exe : les anciennes versions de l'appli
      # prennent le premier .exe de la Release pour se mettre à jour.
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = "${{ env.TAG }}".TrimStart("v")
          & $iscc "/DMyVersion=$ver" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer to release
        shell: bash
        run: gh release upload "$TAG" dist/STATION-SDR-Setup-*.exe --clobber -R "${{ github.repository }}"

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libtk8.6 libtcl8.6 tk-dev xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name STATION-SDR \
            --add-data "station_sdr/assets/logo.png:assets" \
            --add-data "station_sdr/assets/icon.ico:assets" \
            --add-data "station_sdr/assets/flags.json:assets" \
            --hidden-import PIL._tkinter_finder \
            --collect-all tkintermapview --collect-all PIL run.py
          mv dist/STATION-SDR "dist/STATION-SDR-linux-${{ matrix.arch }}"
          chmod 755 "dist/STATION-SDR-linux-${{ matrix.arch }}"

      - name: Smoke test (démarrage 20 s sous Xvfb)
        run: |
          set +e
          rm -f /tmp/station_sdr_crash.log
          PYTHONFAULTHANDLER=1 timeout 20 xvfb-run -a "dist/STATION-SDR-linux-${{ matrix.arch }}"
          code=$?
          set -e
          if [ -f /tmp/station_sdr_crash.log ]; then cat /tmp/station_sdr_crash.log; fi
          if grep -q "démarrage" /tmp/station_sdr_crash.log 2>/dev/null; then exit 1; fi
          if [ "$code" != "124" ] && [ "$code" != "0" ]; then echo "Code de sortie $code"; exit 1; fi

      - name: Upload to release
        run: gh release upload "$TAG" "dist/STATION-SDR-linux-${{ matrix.arch }}" --clobber -R "${{ github.repository }}"

  release:
    # La version Windows est publiée même si une compilation Linux échoue.
    needs: [windows, linux]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest -R "${{ github.repository }}"
