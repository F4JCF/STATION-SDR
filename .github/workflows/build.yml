name: Build and release Windows executable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à compiler et publier (ex: v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name STATION-SDR `
            --icon station_sdr/assets/icon.ico `
            --add-data "station_sdr/assets/logo.png;assets" `
            --add-data "station_sdr/assets/icon.ico;assets" `
            --add-data "station_sdr/assets/flags.json;assets" `
            --hidden-import pystray._win32 `
            --collect-all tkintermapview --collect-all PIL run.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/STATION-SDR.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
