# Surcharge de direwolf.service : Direwolf recoit le son de rtl_fm
# (144,800 MHz, clé SDR) au lieu d'une carte son.
[Service]
User=root
ExecStart=
ExecStart=/bin/sh -c 'rtl_fm -d 0 -f 144.800M -s 24000 -g 40 - | /usr/bin/direwolf -c /etc/direwolf.conf -r 24000 -D 1 -t 0 -'
Restart=always
RestartSec=5
